[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msdemosaic"
version = "0.1.0"
description = "Pattern-agnostic multispectral demosaicking"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["msdemosaic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
